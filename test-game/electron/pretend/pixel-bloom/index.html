<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pixel Bloom</title>
<style>
  body { margin: 0; background: #0b0b18; color: #ddd; font: 15px system-ui, sans-serif; }
  #bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; justify-content: center; }
  button { font: inherit; padding: 8px 12px; border: 0; border-radius: 6px; background: #e86fb0; color: #201; cursor: pointer; }
  #stage { display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <button id="shoot">Shoot</button>
  <button id="reload">Reload</button>
  <button id="hurt">Take a hit</button>
  <button id="bloom">Bloom (combo up)</button>
  <button id="shop">Buy a heart (200 points)</button>
</div>
<script type="module" src="dist/game.js"></script>
</body>
</html>
