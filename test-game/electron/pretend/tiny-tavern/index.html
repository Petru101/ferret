<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tiny Tavern</title>
<style>
  body { margin: 0; background: #3a2618; color: #f6e7cf; font: 16px Georgia, serif; }
  main { max-width: 760px; margin: 20px auto; padding: 0 16px; }
  h1 { margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .stat { background: #553722; padding: 8px 12px; border-radius: 8px; min-width: 130px; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 9px 13px; border-radius: 8px; border: 0; background: #e3b23c; color: #2b1a0c; cursor: pointer; }
  ul { padding-left: 20px; }
  .msg { color: #e9c99a; font-style: italic; min-height: 1.3em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="dist/game.js"></script>
</body>
</html>
