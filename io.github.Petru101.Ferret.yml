id: io.github.Petru101.Ferret
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ferret
# Every language ships inside the app (a Locale extension would only install the system's).
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  # Notifications over a fullscreen game need critical urgency, which the portal can't send.
  - --talk-name=org.freedesktop.Notifications
  # Send Feedback (feedback.rs): reports go to Ferret's server over HTTPS.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
modules:
  # PaddleOCR PP-OCRv6 small (Apache-2.0): text detection and recognition, run by rten.
  - name: ocr-models
    buildsystem: simple
    build-commands:
      - install -Dm644 det.onnx /app/share/ferret/ocr/det.onnx
      - install -Dm644 rec.onnx /app/share/ferret/ocr/rec.onnx
      - install -Dm644 rec.yml /app/share/ferret/ocr/rec.yml
      - install -Dm644 LICENSE /app/share/licenses/io.github.Petru101.Ferret/PaddleOCR-LICENSE
    sources:
      - type: file
        url: https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/28fe5895c24fd108c19eb3e8479f4ab385fbfc62/inference.onnx
        sha256: d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e
        dest-filename: det.onnx
      - type: file
        url: https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.onnx
        sha256: 5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634
        dest-filename: rec.onnx
      - type: file
        url: https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.yml
        sha256: ab078671bb49f06228eadccd34f1bb501e157f7a047095ffb943ba81512c77d1
        dest-filename: rec.yml
      - type: file
        url: https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/v3.7.0/LICENSE
        sha256: 3840c5c0c61c294264d2dd77b8777be6ddd90121ef4e0e64abcd22edea581d6e

  - name: ferret
    buildsystem: simple
    build-commands:
      - cargo build --release --offline -p ferret
      - install -Dm755 target/release/ferret /app/bin/ferret
      # The helper runs on the host, outside the runtime, so it is linked
      # statically. The SDK has no static libm; std only needs its name.
      - mkdir -p stub && ar rc stub/libm.a
      - >-
        RUSTFLAGS="-C target-feature=+crt-static -L native=$PWD/stub"
        cargo build --release --offline --target x86_64-unknown-linux-gnu -p ferret-helper
      - install -Dm755 target/x86_64-unknown-linux-gnu/release/ferret-helper /app/bin/ferret-helper
      # Translations (po/): the window's texts and the desktop file's.
      - >-
        for lang in $(cat po/LINGUAS); do
        install -d /app/share/locale/$lang/LC_MESSAGES &&
        msgfmt -c -o /app/share/locale/$lang/LC_MESSAGES/ferret.mo po/$lang.po || exit 1; done
      - install -d /app/share/applications
      - msgfmt --desktop -d po --template data/io.github.Petru101.Ferret.desktop -o /app/share/applications/io.github.Petru101.Ferret.desktop
      - install -Dm644 data/io.github.Petru101.Ferret.svg /app/share/icons/hicolor/scalable/apps/io.github.Petru101.Ferret.svg
      # The helper carries AreWeAntiCheatYet's list (MIT).
      - install -Dm644 data/areweanticheatyet/LICENSE /app/share/licenses/io.github.Petru101.Ferret/AreWeAntiCheatYet-LICENSE
    sources:
      - type: dir
        path: .
        skip:
          - target
          - build-dir
          - repo
          - test-game
          - run
          - bench
          - images
          - images 2
          - data/screenshots
          - stub
          - .flatpak-builder
